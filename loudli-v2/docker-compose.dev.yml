version: '3.8'

# Development configuration with hot reload
services:
  db:
    image: postgres:15-alpine
    container_name: loudli-db
    environment:
      POSTGRES_USER: loudli
      POSTGRES_PASSWORD: loudli_password
      POSTGRES_DB: loudli
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loudli"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: loudli-backend
    environment:
      - SECRET_KEY=docker-dev-secret-key-change-in-production
      - DATABASE_URL=postgresql+asyncpg://loudli:loudli_password@db:5432/loudli
      - CORS_ORIGINS=["http://localhost:3000","http://localhost"]
      - DEBUG=true
    volumes:
      - ./backend/app:/app/app:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: loudli-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
